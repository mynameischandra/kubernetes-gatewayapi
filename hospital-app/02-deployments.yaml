apiVersion: apps/v1
kind: Deployment
metadata:
  name: med-portal
  namespace: hospital-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: med-portal
  template:
    metadata:
      labels:
        app: med-portal
    spec:
      containers:
      - name: web-portal
        image: fincoro-app:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: APP_ROLE
          value: hospital-frontend
        ports:
        - containerPort: 8080
          protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: med-dashboard
