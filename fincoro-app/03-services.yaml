apiVersion: v1
kind: Service
metadata:
  name: web-portal
  namespace: banking-system
spec:
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: web-portal
---
apiVersion: v1
kind: Service
metadata:
  name: user-console
  namespace: banking-system
spec:
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: user-console
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: banking-system
spec:
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: identity-service
---
apiVersion: v1
kind: Service
metadata:
  name: core-api
  namespace: banking-system
spec:
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: core-api
    version: v1
---
apiVersion: v1
kind: Service
metadata:
  name: core-api-canary
  namespace: banking-system
spec:
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: core-api
    version: v2
