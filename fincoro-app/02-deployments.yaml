apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-portal
  namespace: banking-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-portal
  template:
    metadata:
      labels:
        app: web-portal
    spec:
      containers:
      - name: web-portal
        image: fincoro-app:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: APP_ROLE
          value: frontend
        ports:
        - containerPort: 8080
          protocol: TCP
---
